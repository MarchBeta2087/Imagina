# Tier 1 platforms are built here: Linux (GCC and Clang, with a headless render
# check) and Windows (MSVC with vcpkg, and MinGW-w64).  macOS and the BSDs are
# Tier 2: expected to build, no CI.  See the platform support section of the
# Readme.
name: build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            ${{ matrix.compiler == 'gcc' && 'g++' || 'clang' }} \
            libgmp-dev libpng-dev zlib1g-dev \
            libgl1-mesa-dev libgl1-mesa-dri xvfb \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMAGINA_FRONTEND=sdl \
            -DBUILD_GUI=ON \
            -DBUILD_CODEC_TEST=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Codec test
        run: ./build/RawMapCodecTest

      - name: Render a frame (software OpenGL under Xvfb)
        run: |
          set -x
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/Imagina \
            --frames 90 --screenshot /tmp/shot.bmp
          ls -l /tmp/shot.bmp

      - name: Check the screenshot is not an empty canvas
        run: |
          python3 - <<'EOF'
          import struct
          data = open('/tmp/shot.bmp', 'rb').read()
          offset = struct.unpack_from('<I', data, 10)[0]
          width, height = struct.unpack_from('<ii', data, 18)
          stride = ((width * 4) + 3) // 4 * 4
          flipped = height > 0
          rows = abs(height)

          def pixel(x, y):
              row = rows - 1 - y if flipped else y
              i = offset + row * stride + x * 4
              return data[i + 2], data[i + 1], data[i]

          samples = [pixel(x, y) for y in range(40, rows - 2, 23) for x in range(2, width, 23)]
          colours = len(set(samples))
          black = sum(1 for c in samples if sum(c) < 24) / len(samples)
          print(f'{width}x{height}, {colours} distinct colours, {black:.1%} black')
          # The default view has the Mandelbrot set in the middle: a flat image
          # means the computation or the texture upload did not work.
          assert colours > 50, 'the image looks flat'
          assert black > 0.01, 'the set interior is missing'
          EOF

  windows-msvc:
    name: Windows (MSVC, vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }
          "$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            build/windows-msvc/vcpkg_installed
            build/windows-msvc-sdl/vcpkg_installed
          key: vcpkg-msvc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-msvc-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Win32 front-end)
        run: cmake --preset windows-msvc

      - name: Build (Win32 front-end)
        run: cmake --build --preset windows-msvc --parallel

      - name: Configure (SDL front-end)
        run: cmake --preset windows-msvc-sdl

      - name: Build (SDL front-end)
        run: cmake --build --preset windows-msvc-sdl --parallel

      - name: Codec test
        shell: pwsh
        run: |
          ./build/windows-msvc/RawMapCodecTest.exe
          ./build/windows-msvc-sdl/RawMapCodecTest.exe

      - name: Run the SDL front-end for a few frames
        shell: pwsh
        run: |
          ./build/windows-msvc-sdl/Imagina.exe --frames 120 --screenshot shot.bmp
          Get-Item shot.bmp | Select-Object Length

  windows-mingw:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-mesa

      - name: Configure (SDL front-end)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMAGINA_FRONTEND=sdl \
            -DBUILD_CODEC_TEST=ON

      - name: Build (SDL front-end)
        run: cmake --build build --parallel

      - name: Codec test
        run: ./build/RawMapCodecTest.exe

      - name: Configure and build the Win32 front-end
        run: |
          cmake -S . -B build-win32 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMAGINA_FRONTEND=win32 \
            -DMPIR_USE_DLL=OFF
          cmake --build build-win32 --parallel
